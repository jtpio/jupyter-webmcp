name: Build

on:
  push:
    branches: main
  pull_request:
    branches: '*'
  schedule:
    # Every Monday, to find the WebMCP changes of new Chrome releases
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  # The pushes do not cancel the weekly run
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Base Setup
      uses: jupyterlab/maintainer-tools/.github/actions/base-setup@v1

    - name: Install dependencies
      run: python -m pip install -U "jupyterlab>=4.6,<5"

    - name: Lint the extension
      run: |
        set -eux
        jlpm
        jlpm run lint:check

    - name: Test the extension
      run: |
        set -eux
        jlpm run test

    - name: Build the extension
      run: |
        set -eux
        python -m pip install .[test]

        jupyter labextension list
        jupyter labextension list 2>&1 | grep -ie "jupyter-webmcp.*OK"
        python -m jupyterlab.browser_check

    - name: Package the extension
      run: |
        set -eux

        pip install build
        python -m build
        pip uninstall -y "jupyter_webmcp" jupyterlab

    - name: Upload extension packages
      uses: actions/upload-artifact@v7
      with:
        name: extension-artifacts
        path: dist/jupyter_webmcp*
        if-no-files-found: error

  test_isolated:
    needs: build
    runs-on: ubuntu-latest

    steps:
    - name: Install Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'
        architecture: 'x64'
    - uses: actions/download-artifact@v8
      with:
        name: extension-artifacts
    - name: Install and Test
      run: |
        set -eux
        # Remove NodeJS, twice to take care of system and locally installed node versions.
        sudo rm -rf $(which node)
        sudo rm -rf $(which node)

        pip install "jupyterlab>=4.6,<5" jupyter_webmcp*.whl


        jupyter labextension list
        jupyter labextension list 2>&1 | grep -ie "jupyter-webmcp.*OK"
        python -m jupyterlab.browser_check --no-browser-test

  integration-tests:
    name: Integration tests (${{ matrix.browser }})
    needs: build
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Chrome stable and beta only run on schedule and on demand
        browser: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["chromium", "chrome", "chrome-beta"]' || '["chromium"]') }}

    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/pw-browsers
      WEBMCP_TEST_CHANNEL: ${{ matrix.browser != 'chromium' && matrix.browser || '' }}

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Base Setup
      uses: jupyterlab/maintainer-tools/.github/actions/base-setup@v1

    - name: Download extension package
      uses: actions/download-artifact@v8
      with:
        name: extension-artifacts

    - name: Install the extension
      run: |
        set -eux
        # The same jupyterlab-ai-commands as in build_lite.sh and the tool schemas of the tests.
        python -m pip install "jupyterlab>=4.6,<5" "notebook>=7.6,<8" \
          "jupyterlab-ai-commands==0.4.0" jupyter_webmcp*.whl

    - name: Install dependencies
      working-directory: ui-tests
      env:
        YARN_ENABLE_IMMUTABLE_INSTALLS: 0
        PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      run: jlpm install

    - name: Set up browser cache
      uses: actions/cache@v6
      with:
        path: |
          ${{ github.workspace }}/pw-browsers
        key: ${{ runner.os }}-${{ hashFiles('ui-tests/yarn.lock') }}

    - name: Install browser
      run: |
        set -eux
        if [ -z "$WEBMCP_TEST_CHANNEL" ]; then
          jlpm playwright install chromium --only-shell
        else
          # The runner image can have an older Chrome stable
          jlpm playwright install --force "$WEBMCP_TEST_CHANNEL"
        fi
      working-directory: ui-tests

    - name: Build the JupyterLite site
      working-directory: ui-tests
      run: |
        set -eux
        python -m pip install uv
        export WEBMCP_LABEXTENSION="$(python -c 'import sys; print(sys.prefix)')/share/jupyter/labextensions/jupyter-webmcp"
        jlpm build:lite

    - name: Execute integration tests
      working-directory: ui-tests
      run: |
        jlpm playwright test

    - name: Upload Playwright Test report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: jupyter_webmcp-playwright-tests-${{ matrix.browser }}
        path: |
          ui-tests/test-results
          ui-tests/playwright-report

  check_links:
    name: Check Links
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: jupyterlab/maintainer-tools/.github/actions/base-setup@v1
      - uses: jupyterlab/maintainer-tools/.github/actions/check-links@v1
        with:
          ignore_links: "https://jtpio.github.io/jupyter-webmcp/.*"

  report_failure:
    name: Report the failure of the weekly run
    needs: [build, test_isolated, integration-tests, check_links]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open an issue, or comment on the open one
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -eux
          title="The weekly run of the Build workflow failed"
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" \
              --body "The weekly run failed again: $RUN_URL"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --label maintenance \
              --body "The weekly run tests Chrome stable and beta, and the links. See the failed jobs of $RUN_URL."
          fi
