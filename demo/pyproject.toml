[project]
name = "jupyter-webmcp-demo"
version = "0.1.0"
description = "JupyterLite demo for jupyter-webmcp"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jupyter-webmcp",
    "jupyterlite-core[contents]>=0.8.6,<0.9",
    "jupyterlite-pyodide-kernel>=0.8.6,<0.9",
    # Kernels
    "jupyterlite-javascript-kernel>=0.4.0a5",
    "jupyterlite-p5-kernel>=0.4.0a2",
    # Widgets
    "anywidget>=0.11.0",
    "bqplot>=0.13.1",
    "ipycanvas>=0.14.3",
    "ipyleaflet>=0.20.0",
    "ipympl>=0.10.0",
    "ipywidgets>=8.1.9",
    "plotly>=7.1.0",
    # Themes
    "jupyterlab-cursor-dark>=1.0.2",
    "jupyterlab-cursor-light>=1.0.2",
    "jupyterlab-night>=0.5.2",
]

[tool.uv]
# uv does not see changes of the built extension in the parent directory.
reinstall-package = ["jupyter-webmcp"]

[tool.uv.sources]
jupyter-webmcp = { path = ".." }
